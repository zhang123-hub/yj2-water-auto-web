.wgm-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(2,8,18,.8);backdrop-filter:blur(5px)}
.wgm-panel{position:relative;width:min(760px,100%);max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:auto;background:#082446;color:#fff;outline:1px solid rgba(255,255,255,.34);box-shadow:0 24px 80px rgba(0,0,0,.48),0 0 34px rgba(52,209,209,.12);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.wgm-panel *{box-sizing:border-box}
.wgm-header{flex:0 0 auto;height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.035)}
.wgm-title{font-size:17px;font-weight:800;letter-spacing:.14em;white-space:nowrap}
.wgm-time{font-family:Consolas,"JetBrains Mono",monospace;font-size:18px;font-weight:700;color:#34d1d1;letter-spacing:.1em}
.wgm-header-right{justify-self:end;display:flex;align-items:center;gap:6px}
.wgm-icon-btn{height:26px;padding:0 8px;border:1px solid rgba(255,255,255,.28);border-radius:4px;background:transparent;color:rgba(255,255,255,.78);font-size:11px;cursor:pointer;transition:border-color .18s,color .18s,background .18s;white-space:nowrap}
.wgm-icon-btn:hover{border-color:#34d1d1;color:#34d1d1;background:rgba(52,209,209,.08)}
.wgm-icon-btn--on{border-color:rgba(52,209,209,.7);color:#34d1d1}
.wgm-close{width:28px;height:28px;border:1px solid rgba(255,255,255,.28);border-radius:4px;background:transparent;color:rgba(255,255,255,.78);font-size:19px;line-height:1;cursor:pointer;transition:border-color .18s,color .18s,background .18s}
.wgm-close:hover{border-color:#34d1d1;color:#34d1d1;background:rgba(52,209,209,.08)}
.wgm-stage{position:relative;flex:0 0 auto;width:100%;background:#04162d}
.wgm-canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none}
.wgm-paused{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:rgba(2,10,22,.42);pointer-events:none}
.wgm-paused span{padding:8px 18px;border:1px solid rgba(52,209,209,.65);background:rgba(8,36,70,.92);color:#34d1d1;font-size:13px;font-weight:700;letter-spacing:.18em}
.wgm-dash{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 14px 10px;border-top:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);font-size:11px;line-height:1.5}
.wgm-dash-item{display:flex;flex-direction:column;gap:2px;min-width:88px}
.wgm-dash-label{color:rgba(255,255,255,.45);letter-spacing:.08em;font-size:10px}
.wgm-dash-value{font-family:Consolas,"JetBrains Mono",monospace;font-weight:700;color:rgba(255,255,255,.9)}
.wgm-dash-value b{color:#34d1d1}
.wgm-zone-green{color:#2fe6a7}
.wgm-zone-orange{color:#ffad33}
.wgm-zone-red{color:#ff4d5e}
.wgm-zone-low{color:#34d1d1}
.wgm-phases{display:flex;gap:3px;margin-top:3px}
.wgm-phase-seg{position:relative;height:5px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden}
.wgm-phase-seg i{position:absolute;inset:0 auto 0 0;display:block;background:#34d1d1;transition:width .2s linear}
.wgm-phase-seg--done i{background:#2fe6a7}
.wgm-phase-seg--active{box-shadow:0 0 0 1px rgba(255,173,51,.6)}
.wgm-phase-seg--active i{background:#ffad33}
.wgm-valves{display:flex;gap:5px;margin-top:2px}
.wgm-valve{width:16px;height:16px;border:1px solid rgba(255,255,255,.26);border-radius:2px;font-size:9px;line-height:14px;text-align:center;color:rgba(255,255,255,.42)}
.wgm-valve--on{border-color:#2fe6a7;background:rgba(47,230,167,.22);color:#2fe6a7}
.wgm-footer{flex:0 0 auto;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03)}
.wgm-hint{max-width:430px;font-size:11px;line-height:1.6;letter-spacing:.04em;color:rgba(255,255,255,.5)}
.wgm-actions{display:flex;gap:8px}
.wgm-btn{min-width:96px;height:32px;padding:0 12px;border:1px solid rgba(52,209,209,.72);border-radius:4px;background:rgba(52,209,209,.12);color:#34d1d1;font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background .18s,color .18s,transform .12s}
.wgm-btn:hover{background:#34d1d1;color:#082446}
.wgm-btn:active{transform:scale(.97)}
.wgm-btn:disabled{opacity:.42;cursor:not-allowed}
.wgm-btn--ghost{border-color:rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.72)}
.wgm-btn--ghost:hover{border-color:#fff;background:#fff;color:#082446}
.wgm-puzzle{position:absolute;top:10px;right:10px;z-index:3;width:min(330px,62%);max-height:calc(100% - 20px);overflow:auto;padding:11px 13px;background:rgba(5,24,46,.96);outline:1px solid rgba(255,173,51,.55);box-shadow:0 8px 28px rgba(0,0,0,.45)}
.wgm-puzzle-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.wgm-puzzle-title{font-size:12px;font-weight:800;letter-spacing:.1em;color:#ffad33}
.wgm-puzzle-left{font-family:Consolas,monospace;font-size:10px;color:rgba(255,255,255,.55)}
.wgm-puzzle-brief{margin:0 0 8px;font-size:11px;line-height:1.6;color:rgba(255,255,255,.78)}
.wgm-puzzle-hint{margin:0 0 8px;font-size:10px;line-height:1.5;color:rgba(52,209,209,.8)}
.wgm-puzzle-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:11px}
.wgm-puzzle-row b{font-family:Consolas,monospace;color:#34d1d1}
.wgm-puzzle input[type=number]{width:100%;height:28px;padding:0 8px;border:1px solid rgba(255,255,255,.3);border-radius:3px;background:rgba(255,255,255,.06);color:#fff;font-family:Consolas,monospace;font-size:13px;outline:none}
.wgm-puzzle input[type=number]:focus{border-color:#34d1d1}
.wgm-choice{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.wgm-choice label{display:flex;align-items:center;gap:6px;padding:5px 7px;border:1px solid rgba(255,255,255,.2);border-radius:3px;font-size:11px;cursor:pointer}
.wgm-choice label:hover{border-color:rgba(52,209,209,.6)}
.wgm-choice input{accent-color:#34d1d1}
.wgm-seq{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.wgm-seq-btn{flex:1 1 46%;min-height:28px;padding:4px 6px;border:1px solid rgba(255,255,255,.28);border-radius:3px;background:transparent;color:rgba(255,255,255,.8);font-size:11px;cursor:pointer}
.wgm-seq-btn:hover{border-color:#34d1d1;color:#34d1d1}
.wgm-seq-btn--picked{border-color:#ffad33;background:rgba(255,173,51,.18);color:#ffad33}
.wgm-seq-order{margin:0 0 8px;font-size:10px;color:rgba(255,255,255,.6)}
.wgm-puzzle-error{margin:0 0 6px;font-size:10px;color:#ff4d5e}
.wgm-puzzle-actions{display:flex;gap:6px}
.wgm-puzzle-actions .wgm-btn{min-width:0;flex:1;height:28px;font-size:11px}
.wgm-result{position:absolute;inset:56px 0 0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,10,22,.66);backdrop-filter:blur(3px)}
.wgm-result-card{width:min(420px,100%);padding:24px 26px;text-align:center;background:rgba(8,36,70,.95);outline:1px solid rgba(52,209,209,.48);box-shadow:0 0 30px rgba(52,209,209,.12)}
.wgm-result--perfect .wgm-result-card{outline-color:rgba(255,209,102,.75);box-shadow:0 0 34px rgba(255,209,102,.16)}
.wgm-result--normal .wgm-result-card{outline-color:rgba(255,173,51,.6)}
.wgm-result--fail .wgm-result-card{outline-color:rgba(255,77,94,.75);box-shadow:0 0 34px rgba(255,77,94,.14)}
.wgm-result-badge{margin-bottom:8px;font-size:10px;letter-spacing:.3em;color:rgba(255,255,255,.55)}
.wgm-result-title{margin:0 0 10px;font-size:23px;font-weight:900;letter-spacing:.16em}
.wgm-result--perfect .wgm-result-title{color:#ffd166}
.wgm-result--normal .wgm-result-title{color:#ffad33}
.wgm-result--fail .wgm-result-title{color:#ff4d5e}
.wgm-result-message{margin:0 0 14px;font-size:13px;line-height:1.85;color:rgba(255,255,255,.86);text-align:left}
.wgm-result-stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:14px;font-size:11px;color:rgba(255,255,255,.6)}
.wgm-result-stats b{display:block;margin-top:2px;font-family:Consolas,monospace;font-size:16px;color:#34d1d1}
.wgm-result-score{margin-bottom:18px;font-family:Consolas,"JetBrains Mono",monospace;font-size:12px;color:rgba(255,255,255,.58)}
.wgm-result-score b{font-size:24px;margin-left:6px}
.wgm-result--perfect .wgm-result-score b{color:#ffd166}
.wgm-result--normal .wgm-result-score b{color:#34d1d1}
.wgm-result--fail .wgm-result-score b{color:#ff4d5e}
@media (max-width:560px){
.wgm-header{height:50px;padding:0 10px}
.wgm-title{font-size:14px;letter-spacing:.08em}
.wgm-time{font-size:15px}
.wgm-icon-btn{height:24px;padding:0 6px;font-size:10px}
.wgm-dash{gap:5px 12px;padding:7px 10px 9px}
.wgm-dash-item{min-width:72px}
.wgm-puzzle{width:min(280px,72%);top:6px;right:6px;padding:9px 10px}
.wgm-footer{padding:7px 10px}
.wgm-hint{display:none}
.wgm-btn{min-width:84px;height:30px;font-size:11px}
}
